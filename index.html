<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WazBotz</title>
<script src="https://jsdelivr.net"></script>
<script src="https://cloudflare.com"></script>
<style>
:root{--ink:#0A0A0A;--mute:#5E5E5E;--acc:#FFD400;--pop:#FF2D87;--bg:#F7F7F2}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.6 system-ui,sans-serif;background:linear-gradient(rgba(247,247,242,.87),rgba(247,247,242,.87)),url('bg.jpg') center/cover fixed no-repeat,var(--bg)}
@media (max-width:768px){body{background-attachment:scroll}}
nav{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 20px;background:var(--ink);border-bottom:4px solid var(--acc)}
nav .logo{font-weight:900;font-size:1.35rem;color:#fff;text-decoration:none;margin-right:auto;letter-spacing:.3px}
nav a{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.8rem;letter-spacing:1.2px}
nav a:hover{color:var(--acc)}
nav .mute{color:#9A9A9A;text-transform:none;letter-spacing:0;font-weight:600}
main{max-width:720px;margin:0 auto;padding:24px 20px 60px}
h1,h2{line-height:1.15;font-weight:900;letter-spacing:-.5px}
.card{background:#fff;border:2px solid var(--ink);border-radius:0;padding:14px 18px;margin:0 0 12px;display:block;text-decoration:none;color:inherit;box-shadow:5px 5px 0 var(--pop);transition:box-shadow .12s,transform .12s}
.card:hover{box-shadow:7px 7px 0 var(--acc);transform:translate(-2px,-2px)}
.card small,.mute{color:var(--mute)}
input,button{font:inherit}
input{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:0;margin:0 0 10px;background:#fff}
button{background:var(--acc);color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button.alt{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--pop)}
button.pop{background:var(--pop);color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
#ed{min-height:300px;background:#fff;border:2px solid var(--ink);border-radius:0;padding:12px}
.body img,#ed img{max-width:100%;height:auto}
.msg{color:#C4005F;font-weight:700}
</style></head><body>
<nav id="nav"></nav><main id="app">Loading…</main>
<script>
const SUPABASE_URL='https://supabase.co';
const SUPABASE_KEY='sb_publishable_nRBg4kEv4joY5JKVGorzdg_BP24Pev7';

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const \$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=h=>DOMPurify.sanitize(h,{ADD_ATTR:['target']});
const fmt=d=>new Date(d).toLocaleDateString();
let me=null;
const canWrite=()=>me&&(me.role==='writer'||me.role==='admin');

async function setUser(session){
  me=null;
  if(session){
    try {
      const {data}=await db.from('profiles').select('*').eq('id',session.user.id).single();
      me=data;
    } catch(e) { console.log(e); }
  }
  \$('nav').innerHTML='<a class="logo" href="#/">WazBotz</a>'+
    (canWrite()?'<a href="#/mine">My posts</a><a href="#/write">Write</a>':'')+
    (me?.role==='admin'?'<a href="#/admin">Admin</a>':'')+
    (me?`<span class="mute">${esc(me.name)}</span><a href="#" id="out">Log out</a>`:'<a href="#/login">Log in</a>');
  if(('out'))('out').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.hash='#/'};
}

async function route(){
  const [,page,id]=location.hash.split('/');
  const a=\$('app');
  if(page=='login')return login();
  if(page=='post')return view(id);
  if(page=='write')return canWrite()?write(id):(a.innerHTML='<h2>Writers only</h2><p>Ask the team leader to approve your email.</p>');
  if(page=='mine')return canWrite()?mine():(a.innerHTML='<p>Writers only.</p>');
  if(page=='admin')return me?.role==='admin'?admin():(a.innerHTML='<p>Admins only.</p>');
  home();
}

async function home(){
  const {data}=await db.from('posts').select('id,title,author_name,created_at').eq('published',true).order('created_at',{ascending:false});
  \$('app').innerHTML='<h1>Latest posts</h1>'+(data?.length?data.map(p=>`<a class="card" href="#/post/${p.id}"><b>${esc(p.title)}</b><br><small>${esc(p.author_name)} · ${fmt(p.created_at)}</small></a>`).join(''):'<p class="mute">Nothing posted yet.</p>');
}

async function view(id){
  const {data:p}=await db.from('posts').select('*').eq('id',id).single();
  if(!p)return \$('app').innerHTML='<p>Post not found.</p>';
  const mine=me&&(me.id===p.author_id||me.role==='admin');
  \$('app').innerHTML=`<h1>${esc(p.title)}</h1><p class="mute">By ${esc(p.author_name)} · ${fmt(p.created_at)}${p.published?'':' · <b>Draft</b>'}</p>
  <div class="body">${clean(p.body)}</div>${mine?`<p><a href="#/write/\${p.id}"><button class="alt">Edit</button></a></p>`:''}`;
}

async function mine(){
  const {data}=await db.from('posts').select('id,title,published,created_at').eq('author_id',me.id).order('created_at',{ascending:false});
  \$('app').innerHTML='<h1>My posts</h1><p><a href="#/write"><button>New post</button></a></p>'+(data||[]).map(p=>`<a class="card" href="#/write/${p.id}"><b>${esc(p.title)}</b> <small>${p.published?'Published':'Draft'} · ${fmt(p.created_at)}</small></a>`).join('');
}

async function write(id){
  let p={title:'',body:'',published:false};
  if(id){const {data}=await db.from('posts').select('*').eq('id',id).single();if(data)p=data;}
  const cmd=(c,v)=>`onclick="document.execCommand('${c}',false,${v?`'\${v}'`:'null'});$('ed').focus()"`;
  \$('app').innerHTML=`<h1>${id?'Edit post':'New post'}</h1>
  <input id="t" placeholder="Title" value="${esc(p.title)}">
  <div class="bar"><button class="alt" ${cmd('bold')}>Bold</button><button class="alt" ${cmd('formatBlock','h2')}>Heading</button><button class="alt" ${cmd('formatBlock','p')}>Text</button><button class="alt" ${cmd('insertUnorderedList')}>List</button>
  <button class="alt" onclick="const u=prompt('Link address');if(u)document.execCommand('createLink',false,u)">Link</button>
  <button class="alt" id="ui">Add image</button><button class="alt" id="uf">Add PDF</button><button class="alt" id="ua">Add file (any type)</button><input type="file" id="fi" hidden></div>
  <div id="ed" contenteditable="true">${clean(p.body)}</div>
  <div class="bar" style="margin-top:12px"><button class="alt" id="sd">Save draft</button><button class="pop" id="pb">Publish</button>${id?'<button class="alt" id="del">Delete</button>':''}</div><p id="m" class="msg"></p>`;
  
  const save=async pub=>{
    const row={title:('t').value.trim()||'Untitled',body:clean(('ed').innerHTML),published:pub};
    const r=id?await db.from('posts').update(row).eq('id',id).select().single():await db.from('posts').insert({...row,author_id:me.id,author_name:me.name}).select().single();
    if(r.error)return \$('m').textContent=r.error.message;
    location.hash=pub?'#/post/'+r.data.id:'#/mine';
  };
  
  let saved=null;
  const keep=()=>{const s=getSelection();if(s.rangeCount&&\(('ed').contains(s.anchorNode))saved=s.getRangeAt(0)};   ['keyup','mouseup','blur'].forEach(e=>\)('ed').addEventListener(e,keep));
  
  const pick=a=>{('fi').accept=a;('fi').click()};
  ('ui').onclick=()=>pick('image/*');('uf').onclick=()=>pick('application/pdf');
  ('ua').onclick=()=>('fi').removeAttribute('accept');\(('fi').click()};\)('fi').onchange=async()=>{
    const f=\$('fi').files[0];
    if(!f)return;
    if(f.size>10*1024*1024)return \(('m').textContent='File too large — 10 MB max.';\)('m').textContent='Uploading…';
    
    const path=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
    
    const { data, error } = await db.storage
      .from('files')
      .upload(path, f, { cacheControl: '3600', upsert: true });

    if(error){
      \$('m').textContent='Upload failed: '+error.message;
      return;
    }

    const { data: urlData } = db.storage.from('files').getPublicUrl(path);
    const url = urlData.publicUrl;

    \$('ed').focus();
    if(saved){
      const s=getSelection();
      s.removeAllRanges();
      s.addRange(saved);
    }
    
    if(f.type.startsWith('image/')){
      document.execCommand('insertImage',false,url);
    }else{
      document.execCommand('createLink',false,url);
      document.execCommand('insertHTML',false,` (Attached Document: ${esc(f.name)})`);
    }
    \$('m').textContent='Uploaded successfully!';
  };

  ('sd').onclick=()=>save(false);('pb').onclick=()=>save(true);
  
  if(('del'))('del').onclick=async()=>{
    if(confirm('Delete this post?')){
      await db.from('posts').delete().eq('id',id);
      location.hash='#/mine';
    }
  };
}

// Fixed listener sync loop causing freeze
db.auth.getSession().then(({data:{session}})=>{
  setUser(session).then(()=>{
    route();
    db.auth.onAuthStateChange((ev,ses)=>{setUser(ses).then(()=>route())});
    window.onhashchange=route;
  });
});
</script>
</body>
</html>
